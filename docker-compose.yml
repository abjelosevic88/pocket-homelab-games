# Pocket Games — your retro game library (Go + SQLite): uploads, play in the
# browser, saves that follow you, and a RomM-compatible API for handheld apps.
# One container, two volumes: the app's data and the game library.
services:
  pocket-games:
    image: ghcr.io/abjelosevic88/pocket-homelab-games:latest
    container_name: pocket-games
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Pushes (Apprise / ntfy / JSON webhook); everyone can set their own under Settings → Notifications.
      NOTIFY_URL: ${NOTIFY_URL:-}
      # Pocket Core: one sign-in, Pocket AI and events for the other Pocket apps.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
      # One folder per system (roms/<system>/… and bios/<system>/…, the RomM
      # layout, or <system>/… directly). An existing RomM library works as is.
      - ./library:/library
    extra_hosts:
      - "host.docker.internal:host-gateway"
